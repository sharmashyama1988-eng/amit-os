# ============================================================
#  AMIT OS — Kernel Hardening Rules
#  Optimized for Security and Stability
# ============================================================

# Disable IP Forwarding (Prevent being used as a router)
net.ipv4.ip_forward = 0

# Protect against SYN flood attacks
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2

# Disable ICMP redirects (Prevent MITM attacks)
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0

# Ignore broadcast ICMP (Prevent Smurf attacks)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Enable ASLR (Address Space Layout Randomization)
kernel.randomize_va_space = 2

# Restrict access to kernel logs
kernel.dmesg_restrict = 1

# Restrict ptrace (Prevent process spying)
kernel.yama.ptrace_scope = 1

# Protect hard/soft links
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
