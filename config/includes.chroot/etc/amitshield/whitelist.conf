# =============================================================================
# AmitShield - Process Whitelist
# Location: /etc/amitshield/whitelist.conf
# =============================================================================
# List trusted process names (one per line) that AmitShield will NEVER flag,
# quarantine, or kill, regardless of their behaviour.
#
# Rules:
#   - Entries are matched against /proc/<pid>/comm (basename only, 15 chars max)
#   - Blank lines and lines beginning with '#' are ignored
#   - Entries are case-sensitive
#   - Wildcards are NOT supported; use exact process names
# =============================================================================

# ── Init / Service Manager ───────────────────────────────────────────────────
systemd

# ── Display Manager ──────────────────────────────────────────────────────────
sddm

# ── KDE Plasma Desktop ───────────────────────────────────────────────────────
plasmashell
kwin_x11
kwin_wayland

# ── Core IPC / DBus ──────────────────────────────────────────────────────────
dbus-daemon

# ── Network Management ───────────────────────────────────────────────────────
NetworkManager

# ── AmitShield Itself ────────────────────────────────────────────────────────
# Always whitelist the daemon so it cannot accidentally self-terminate
amitshield
