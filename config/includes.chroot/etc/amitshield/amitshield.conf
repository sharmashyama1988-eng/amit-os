# =============================================================================
# AmitShield - Main Configuration File
# Location: /etc/amitshield/amitshield.conf
# =============================================================================
# This file controls the core behaviour of the AmitShield security daemon.
# Changes take effect after restarting the service:
#   sudo systemctl restart amitshield
# =============================================================================

[general]
# Logging verbosity: DEBUG | INFO | WARNING | ERROR | CRITICAL
log_level=INFO

# How often (in seconds) the daemon rescans running processes
scan_interval=30

# Run without a graphical tray icon (set true on servers / TTY sessions)
headless=false

[firewall]
# Master switch for the AmitShield managed firewall rules
enabled=true

# Default packet policy when no rule matches: accept | deny | drop
default_policy=deny

# Comma-separated list of TCP ports the firewall will allow inbound
# 22  = SSH
# 80  = HTTP
# 443 = HTTPS
allowed_ports=22,80,443

[threats]
# Terminate and quarantine known cryptocurrency miners on detection
block_miners=true

# Kill processes that establish reverse-shell style outbound connections
block_reverse_shells=true

# Comma-separated process-name substrings treated as hostile
# Add custom patterns here (case-insensitive match against /proc/*/comm)
suspicious_patterns=xmrig,minerd,cpuminer

[notifications]
# Show desktop (libnotify / D-Bus) alerts when a threat is blocked
desktop=true

# Play an audio alert through PulseAudio / PipeWire on threat detection
sound=false
