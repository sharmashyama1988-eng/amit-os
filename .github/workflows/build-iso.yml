name: Build Amit OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get purge -y google-cloud-cli azure-cli microsoft-edge-stable dotnet* || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            live-build live-config live-boot \
            debootstrap squashfs-tools xorriso \
            grub-efi-amd64-bin grub-pc-bin mtools \
            syslinux isolinux syslinux-common syslinux-utils \
            wget curl git python3 python3-pip dos2unix

      - name: Install Python Imaging Library
        run: pip3 install Pillow --quiet --break-system-packages || pip3 install Pillow --quiet

      - name: Convert Line Endings
        run: |
          find . -name "*.sh" -exec dos2unix {} \;
          find . -name "*.hook.chroot" -exec dos2unix {} \;

      - name: Setup Build Environment
        run: |
          BUILD_DIR="/tmp/amitos-build"
          sudo mkdir -p "$BUILD_DIR"
          sudo mkdir -p "$BUILD_DIR/cache"
          cd "$BUILD_DIR"

          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architecture amd64 \
            --initsystem systemd \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian" \
            --mirror-binary "http://deb.debian.org/debian" \
            --linux-packages "linux-image" \
            --linux-flavours "amd64" \
            --binary-images iso-hybrid \
            --iso-builder xorriso \
            --compression gzip \
            --bootappend-live "boot=live components quiet splash hostname=amitos username=amit" \
            --iso-volume "AmitOS 1.0" \
            --iso-publisher "Amit" \
            --iso-application "Amit OS - Fast Secure Linux" \
            --debian-installer false \
            --firmware-binary true \
            --firmware-chroot true \
            --apt-options "--yes --allow-downgrades --allow-remove-essential --allow-change-held-packages -o Acquire::Retries=3 -o Acquire::AllowInsecureRepositories=true -o APT::Get::AllowUnauthenticated=true -o APT::Immediate-Configure=0" \
            --apt-secure false \
            --memtest none \
            --win32-loader false

          # Disable security mirror
          sudo sed -i 's/^LB_SECURITY=.*/LB_SECURITY="false"/' config/chroot
          sudo sed -i 's|^LB_PARENT_MIRROR_CHROOT_SECURITY=.*|LB_PARENT_MIRROR_CHROOT_SECURITY=""|' config/chroot
          sudo sed -i 's|^LB_PARENT_MIRROR_BINARY_SECURITY=.*|LB_PARENT_MIRROR_BINARY_SECURITY=""|' config/chroot
          sudo sed -i 's|^LB_MIRROR_CHROOT_SECURITY=.*|LB_MIRROR_CHROOT_SECURITY=""|' config/chroot
          sudo sed -i 's|^LB_MIRROR_BINARY_SECURITY=.*|LB_MIRROR_BINARY_SECURITY=""|' config/chroot

          # Hot-patch live-build for Debian Bookworm Contents URL shift
          sudo find /usr/lib/live/build/ -type f \
            -exec sed -i 's|dists/\([^/]*\)/Contents-\([^/]*\).gz|dists/\1/main/Contents-\2.gz|g' {} + \
            2>/dev/null || true
          sudo find /usr/lib/live/build/ -type f \
            -exec sed -i 's|main/main|main|g' {} + \
            2>/dev/null || true

      - name: Sync Project Files
        run: |
          BUILD_DIR="/tmp/amitos-build"
          REPO="${GITHUB_WORKSPACE}"

          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/etc/apt"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/local/amitos/apps"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/local/amitos/branding"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/local/amitos/core"
          sudo mkdir -p "$BUILD_DIR/config/hooks/normal"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/local/bin"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/etc/amitshield"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/etc/systemd/system"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/share/applications"

          sudo cp -r "$REPO/branding/"* "$BUILD_DIR/config/includes.chroot/usr/local/amitos/branding/" 2>/dev/null || true
          sudo cp -r "$REPO/apps/"*     "$BUILD_DIR/config/includes.chroot/usr/local/amitos/apps/"     2>/dev/null || true
          sudo cp -r "$REPO/core/"*     "$BUILD_DIR/config/includes.chroot/usr/local/amitos/core/"     2>/dev/null || true
          sudo cp -r "$REPO/themes/"*   "$BUILD_DIR/config/includes.chroot/usr/share/themes/"          2>/dev/null || true
          sudo cp -r "$REPO/config/"*   "$BUILD_DIR/config/"                                           2>/dev/null || true

          sudo cp "$REPO/amitshield/amitshield-ui.py" \
            "$BUILD_DIR/config/includes.chroot/usr/local/amitos/apps/amitshield-ui.py" 2>/dev/null || true
          sudo cp -r "$REPO/bridge/"* \
            "$BUILD_DIR/config/includes.chroot/usr/local/amitos/core/" 2>/dev/null || true

          sudo chmod +x "$BUILD_DIR/config/hooks/normal/"*.hook.chroot 2>/dev/null || true

      - name: Create Package List
        run: |
          BUILD_DIR="/tmp/amitos-build"
          sudo mkdir -p "$BUILD_DIR/config/package-lists"
          # Clean verified package list for Debian Bookworm (base64 encoded)
          echo "" | base64 -di | sudo tee "$BUILD_DIR/config/package-lists/amitos.list.chroot" > /dev/null
          echo "[OK] Package list written: $(wc -l < "$BUILD_DIR/config/package-lists/amitos.list.chroot") packages"
      - name: Create AmitShield Daemon
        run: |
          BUILD_DIR="/tmp/amitos-build"
          echo "" | base64 -di | sudo tee "$BUILD_DIR/config/includes.chroot/usr/local/bin/amitshield" > /dev/null
          sudo chmod +x "$BUILD_DIR/config/includes.chroot/usr/local/bin/amitshield"

          echo "W1VuaXRdCkRlc2NyaXB0aW9uPUFtaXRTaGllbGQgU2VjdXJpdHkgRW5naW5lCkFmdGVyPW5ldHdvcmsudGFyZ2V0CltTZXJ2aWNlXQpUeXBlPXNpbXBsZQpFeGVjU3RhcnQ9L3Vzci9sb2NhbC9iaW4vYW1pdHNoaWVsZApSZXN0YXJ0PW9uLWZhaWx1cmUKUmVzdGFydFNlYz01cwpbSW5zdGFsbF0KV2FudGVkQnk9bXVsdGktdXNlci50YXJnZXQ=" | base64 -di | sudo tee "$BUILD_DIR/config/includes.chroot/etc/systemd/system/amitshield.service" > /dev/null

      - name: Create Desktop Shortcuts
        run: |
          BUILD_DIR="/tmp/amitos-build"
          APPS="$BUILD_DIR/config/includes.chroot/usr/share/applications"
          sudo mkdir -p "$APPS"

          echo "W0Rlc2t0b3AgRW50cnldCk5hbWU9QW1pdEJyb3dzZXIKRXhlYz1jaHJvbWl1bSAtLW5vLXNhbmRib3ggJVUKSWNvbj1jaHJvbWl1bQpUeXBlPUFwcGxpY2F0aW9uCkNhdGVnb3JpZXM9TmV0d29yaztXZWJCcm93c2VyOw==" | base64 -di | sudo tee "$APPS/amitbrowser.desktop" > /dev/null

          echo "W0Rlc2t0b3AgRW50cnldCk5hbWU9QW1pdENhbGMKRXhlYz1xYWxjdWxhdGUtZ3RrCkljb249YWNjZXNzb3JpZXMtY2FsY3VsYXRvcgpUeXBlPUFwcGxpY2F0aW9uCkNhdGVnb3JpZXM9VXRpbGl0eTtDYWxjdWxhdG9yOw==" | base64 -di | sudo tee "$APPS/amitcalc.desktop" > /dev/null

          echo "W0Rlc2t0b3AgRW50cnldCk5hbWU9QW1pdEZpbGVzCkV4ZWM9ZG9scGhpbgpJY29uPXN5c3RlbS1maWxlLW1hbmFnZXIKVHlwZT1BcHBsaWNhdGlvbgpDYXRlZ29yaWVzPVN5c3RlbTtGaWxlTWFuYWdlcjs=" | base64 -di | sudo tee "$APPS/amitfiles.desktop" > /dev/null

          echo "W0Rlc2t0b3AgRW50cnldCk5hbWU9QW1pdFNoaWVsZApFeGVjPWJhc2ggLWMgInN5c3RlbWN0bCBzdGF0dXMgYW1pdHNoaWVsZCB8IHplbml0eSAtLXRleHQtaW5mbyAtLXRpdGxlPUFtaXRTaGllbGQiCkljb249c2VjdXJpdHktaGlnaApUeXBlPUFwcGxpY2F0aW9uCkNhdGVnb3JpZXM9U3lzdGVtO1NlY3VyaXR5Ow==" | base64 -di | sudo tee "$APPS/amitshield-ui.desktop" > /dev/null

      - name: Create Chroot Hooks
        run: |
          BUILD_DIR="/tmp/amitos-build"

          # Removed fake update-initramfs hook since true cpio error cause was syslinux bootlogo

          # DNS fix hook
          echo "IyEvYmluL2Jhc2gKZWNobyAibmFtZXNlcnZlciA4LjguOC44IiA+IC9ldGMvcmVzb2x2LmNvbmY=" | base64 -di | sudo tee "$BUILD_DIR/config/hooks/normal/0000-dns-fix.hook.chroot" > /dev/null
          sudo chmod +x "$BUILD_DIR/config/hooks/normal/0000-dns-fix.hook.chroot"

          # Plymouth activation hook (no update-initramfs - lb build handles initramfs)
          echo "IyEvYmluL2Jhc2gKaWYgY29tbWFuZCAtdiBwbHltb3V0aC1zZXQtZGVmYXVsdC10aGVtZSA+L2Rldi9udWxsIDI+JjE7IHRoZW4KICAgIHBseW1vdXRoLXNldC1kZWZhdWx0LXRoZW1lIGFtaXRvcyAyPi9kZXYvbnVsbCB8fCB0cnVlCmZpCg==" | base64 -di | sudo tee "$BUILD_DIR/config/hooks/normal/0050-plymouth.hook.chroot" > /dev/null
          sudo chmod +x "$BUILD_DIR/config/hooks/normal/0050-plymouth.hook.chroot"

          # Super-fix hook
          echo "IyEvYmluL2Jhc2gKZXhwb3J0IERFQklBTl9GUk9OVEVORD1ub25pbnRlcmFjdGl2ZQpkcGtnIC0tY29uZmlndXJlIC1hIHx8IHRydWUKYXB0LWdldCBpbnN0YWxsIC1mIC15IHx8IHRydWUKWyAtZSAvZGV2L251bGwgXSAmJiBybSAtZiAvZGV2L251bGwKbWtub2QgLW0gNjY2IC9kZXYvbnVsbCBjIDEgMw==" | base64 -di | sudo tee "$BUILD_DIR/config/hooks/normal/9999-super-fix.hook.chroot" > /dev/null
          sudo chmod +x "$BUILD_DIR/config/hooks/normal/9999-super-fix.hook.chroot"

      - name: Create Sources List
        run: |
          BUILD_DIR="/tmp/amitos-build"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/etc/apt"
          echo "ZGViIGh0dHA6Ly9kZWIuZGViaWFuLm9yZy9kZWJpYW4gYm9va3dvcm0gbWFpbiBjb250cmliIG5vbi1mcmVlIG5vbi1mcmVlLWZpcm13YXJlCmRlYiBodHRwOi8vZGViLmRlYmlhbi5vcmcvZGViaWFuIGJvb2t3b3JtLXVwZGF0ZXMgbWFpbiBjb250cmliIG5vbi1mcmVlIG5vbi1mcmVlLWZpcm13YXJl" | base64 -di | sudo tee "$BUILD_DIR/config/includes.chroot/etc/apt/sources.list" > /dev/null

      - name: Copy Boot Files
        run: |
          BUILD_DIR="/tmp/amitos-build"
          sudo mkdir -p "$BUILD_DIR/config/bootloaders/isolinux"
          sudo mkdir -p "$BUILD_DIR/config/includes.binary/isolinux"
          sudo mkdir -p "$BUILD_DIR/config/binary_local-includes/isolinux"
          sudo mkdir -p "$BUILD_DIR/binary/isolinux"

          for f in /usr/lib/ISOLINUX/isolinux.bin \
                   /usr/lib/syslinux/modules/bios/vesamenu.c32 \
                   /usr/lib/syslinux/modules/bios/ldlinux.c32 \
                   /usr/lib/syslinux/modules/bios/libcom32.c32 \
                   /usr/lib/syslinux/modules/bios/libutil.c32 \
                   /usr/lib/syslinux/modules/bios/menu.c32 \
                   /usr/lib/syslinux/modules/bios/chain.c32; do
            if [ -f "$f" ]; then
              sudo cp "$f" "$BUILD_DIR/config/bootloaders/isolinux/"
              sudo cp "$f" "$BUILD_DIR/config/includes.binary/isolinux/"
              sudo cp "$f" "$BUILD_DIR/config/binary_local-includes/isolinux/"
              echo "  [OK] Copied $(basename $f)"
            else
              echo "  [SKIP] $f not found"
            fi
          done

      - name: Generate Bootlogo and Plymouth Splash
        run: |
          BUILD_DIR="/tmp/amitos-build"
          REPO="${GITHUB_WORKSPACE}"

          sudo mkdir -p "$BUILD_DIR/binary/isolinux"
          sudo mkdir -p "$BUILD_DIR/config/bootloaders/isolinux"
          sudo mkdir -p "$BUILD_DIR/config/includes.binary/isolinux"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/share/plymouth/themes/amitos"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/share/pixmaps"

          echo "" | base64 -di | sudo -E python3


          # Plymouth theme descriptor
          echo "W1BseW1vdXRoIFRoZW1lXQpOYW1lPUFtaXRPUwpEZXNjcmlwdGlvbj1BbWl0T1MgQm9vdCBTcGxhc2gKTW9kdWxlTmFtZT1zY3JpcHQKCltzY3JpcHRdCkltYWdlRGlyPS91c3Ivc2hhcmUvcGx5bW91dGgvdGhlbWVzL2FtaXRvcwpTY3JpcHRGaWxlPS91c3Ivc2hhcmUvcGx5bW91dGgvdGhlbWVzL2FtaXRvcy9hbWl0b3Muc2NyaXB0" | base64 -di | sudo tee "$BUILD_DIR/config/includes.chroot/usr/share/plymouth/themes/amitos/amitos.plymouth" > /dev/null

          # Plymouth script: clean static image + native progress bar drawn on top
          echo "" | base64 -di | sudo tee "$BUILD_DIR/config/includes.chroot/usr/share/plymouth/themes/amitos/amitos.script" > /dev/null

          echo "[OK] Bootlogo and Plymouth theme created."

      - name: Build ISO
        run: |
          set -o pipefail
          BUILD_DIR="/tmp/amitos-build"
          cd "$BUILD_DIR"

          # Remove leading whitespace artifact from heredoc-indented hooks
          for f in config/hooks/normal/*.hook.chroot; do
            sudo sed -i 's/^[[:space:]]\{10\}//' "$f" 2>/dev/null || true
          done

          # Ensure bootlogo (dummy cpio) is present for syslinux so it doesn't fail on line 364
          sudo mkdir -p binary/isolinux
          if [ ! -f binary/isolinux/bootlogo ]; then
            sudo cp config/bootloaders/isolinux/bootlogo binary/isolinux/bootlogo 2>/dev/null || true
          fi
          
          # Also ensure splash.png is in binary/isolinux
          if [ ! -f binary/isolinux/splash.png ]; then
            sudo cp config/bootloaders/isolinux/splash.png binary/isolinux/splash.png 2>/dev/null || true
          fi

          echo "=== Starting lb build ==="
          sudo lb build 2>&1 | tee /tmp/lb-build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "=== BUILD FAILED (exit $BUILD_EXIT) ==="
            echo "=== Last 150 lines ==="
            tail -150 /tmp/lb-build.log || true
            exit $BUILD_EXIT
          fi

          echo ""
          echo "=== BUILD SUCCESS ==="
          ls -lh *.iso 2>/dev/null || echo "WARNING: No ISO found!"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amit-os-1.0-amd64
          path: /tmp/amitos-build/*.iso
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build-${{ github.run_number }}
          name: "Amit OS 1.0 Build #${{ github.run_number }}"
          body: |
            ## Amit OS 1.0 - Automated Build

            **Security**: AmitShield Engine with real-time threat detection
            **Desktop**: KDE Plasma with Breeze Dark theme
            **Apps**: 15+ custom apps included
            **Boot**: Custom AmitOS plymouth splash with native progress bar

            Built from commit: ${{ github.sha }}
          files: /tmp/amitos-build/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
