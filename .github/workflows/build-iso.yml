name: Build Amit OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get purge -y google-cloud-cli azure-cli microsoft-edge-stable dotnet* || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            live-build live-config live-boot \
            debootstrap squashfs-tools xorriso \
            grub-efi-amd64-bin grub-pc-bin mtools \
            syslinux isolinux syslinux-common \
            wget curl git python3 python3-pip dos2unix

      - name: Install Python Imaging Library
        run: pip3 install Pillow --quiet --break-system-packages || pip3 install Pillow --quiet

      - name: Convert Line Endings
        run: |
          find . -name "*.sh" -exec dos2unix {} \;
          find . -name "*.hook.chroot" -exec dos2unix {} \;

      - name: Setup Build Environment
        run: |
          BUILD_DIR="/tmp/amitos-build"
          sudo mkdir -p "$BUILD_DIR"
          sudo mkdir -p "$BUILD_DIR/cache"
          cd "$BUILD_DIR"

          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architecture amd64 \
            --initsystem systemd \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian" \
            --mirror-binary "http://deb.debian.org/debian" \
            --linux-packages "linux-image" \
            --linux-flavours "amd64" \
            --binary-images iso-hybrid \
            --compression gzip \
            --bootappend-live "boot=live components quiet splash hostname=amitos username=amit" \
            --iso-volume "AmitOS 1.0" \
            --iso-publisher "Amit" \
            --iso-application "Amit OS - Fast Secure Linux" \
            --debian-installer false \
            --firmware-binary true \
            --firmware-chroot true \
            --apt-options "--yes --allow-downgrades --allow-remove-essential --allow-change-held-packages -o Acquire::Retries=3 -o Acquire::AllowInsecureRepositories=true -o APT::Get::AllowUnauthenticated=true -o APT::Immediate-Configure=0" \
            --apt-secure false \
            --memtest none \
            --win32-loader false

          # Disable security mirror
          sudo sed -i 's/^LB_SECURITY=.*/LB_SECURITY="false"/' config/chroot
          sudo sed -i 's|^LB_PARENT_MIRROR_CHROOT_SECURITY=.*|LB_PARENT_MIRROR_CHROOT_SECURITY=""|' config/chroot
          sudo sed -i 's|^LB_PARENT_MIRROR_BINARY_SECURITY=.*|LB_PARENT_MIRROR_BINARY_SECURITY=""|' config/chroot
          sudo sed -i 's|^LB_MIRROR_CHROOT_SECURITY=.*|LB_MIRROR_CHROOT_SECURITY=""|' config/chroot
          sudo sed -i 's|^LB_MIRROR_BINARY_SECURITY=.*|LB_MIRROR_BINARY_SECURITY=""|' config/chroot

          # Hot-patch live-build for Debian Bookworm Contents URL shift
          sudo find /usr/lib/live/build/ -type f \
            -exec sed -i 's|dists/\([^/]*\)/Contents-\([^/]*\).gz|dists/\1/main/Contents-\2.gz|g' {} + \
            2>/dev/null || true
          sudo find /usr/lib/live/build/ -type f \
            -exec sed -i 's|main/main|main|g' {} + \
            2>/dev/null || true

      - name: Sync Project Files
        run: |
          BUILD_DIR="/tmp/amitos-build"
          REPO="${GITHUB_WORKSPACE}"

          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/etc/apt"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/local/amitos/apps"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/local/amitos/branding"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/local/amitos/core"
          sudo mkdir -p "$BUILD_DIR/config/hooks/normal"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/local/bin"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/etc/amitshield"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/etc/systemd/system"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/share/applications"

          sudo cp -r "$REPO/branding/"* "$BUILD_DIR/config/includes.chroot/usr/local/amitos/branding/" 2>/dev/null || true
          sudo cp -r "$REPO/apps/"*     "$BUILD_DIR/config/includes.chroot/usr/local/amitos/apps/"     2>/dev/null || true
          sudo cp -r "$REPO/core/"*     "$BUILD_DIR/config/includes.chroot/usr/local/amitos/core/"     2>/dev/null || true
          sudo cp -r "$REPO/themes/"*   "$BUILD_DIR/config/includes.chroot/usr/share/themes/"          2>/dev/null || true
          sudo cp -r "$REPO/config/"*   "$BUILD_DIR/config/"                                           2>/dev/null || true

          sudo cp "$REPO/amitshield/amitshield-ui.py" \
            "$BUILD_DIR/config/includes.chroot/usr/local/amitos/apps/amitshield-ui.py" 2>/dev/null || true
          sudo cp -r "$REPO/bridge/"* \
            "$BUILD_DIR/config/includes.chroot/usr/local/amitos/core/" 2>/dev/null || true

          sudo chmod +x "$BUILD_DIR/config/hooks/normal/"*.hook.chroot 2>/dev/null || true

      - name: Create Package List
        run: |
          BUILD_DIR="/tmp/amitos-build"
          sudo mkdir -p "$BUILD_DIR/config/package-lists"
          # Package list stored as base64 to avoid YAML heredoc indentation issues
          echo "" \
            | base64 -d \
            | sudo tee "$BUILD_DIR/config/package-lists/amitos.list.chroot" > /dev/null
          echo "[OK] Package list written: $(wc -l < "$BUILD_DIR/config/package-lists/amitos.list.chroot") packages"
      - name: Create AmitShield Daemon
        run: |
          BUILD_DIR="/tmp/amitos-build"
          sudo tee "$BUILD_DIR/config/includes.chroot/usr/local/bin/amitshield" > /dev/null << 'SHIELD'
#!/usr/bin/env python3
"""AmitShield Security Engine - Amit OS"""
import os, sys, time, re, subprocess, threading, json, logging
from datetime import datetime

logging.basicConfig(filename='/var/log/amitshield.log',
    format='%(asctime)s [%(levelname)s] %(message)s', level=logging.INFO)
log = logging.getLogger('amitshield')

SUSPICIOUS = [r'xmrig',r'minerd',r'cpuminer',r'nc -e',r'/dev/tcp/',
              r'wget.*\|.*bash',r'curl.*\|.*bash']
DANGEROUS_PORTS = {23,135,137,139,445,3389,5900,4444,1337}
PROTECTED = {'systemd','sddm','plasmashell','kwin_x11','dbus-daemon',
             'NetworkManager','amitshield'}

def setup_firewall():
    cmds = [['ufw','default','deny','incoming'],
            ['ufw','default','allow','outgoing'],
            ['ufw','allow','ssh'],['ufw','allow','80/tcp'],
            ['ufw','allow','443/tcp'],['ufw','--force','enable']]
    for c in cmds:
        subprocess.run(c, capture_output=True)
    for p in DANGEROUS_PORTS:
        subprocess.run(['ufw','deny',str(p)], capture_output=True)
    log.info('Firewall active')

def scan_processes():
    import glob
    for pid_path in glob.glob('/proc/[0-9]*/cmdline'):
        try:
            pid = int(pid_path.split('/')[2])
            with open(pid_path,'rb') as f:
                cmd = f.read().replace(b'\x00',b' ').decode(errors='replace')
            name_path = f'/proc/{pid}/comm'
            name = open(name_path).read().strip() if os.path.exists(name_path) else ''
            if name in PROTECTED: continue
            for pat in SUSPICIOUS:
                if re.search(pat, cmd, re.IGNORECASE):
                    log.warning(f'THREAT PID:{pid} NAME:{name} - suspended')
                    os.kill(pid, 19)
                    subprocess.Popen(['notify-send','--urgency=critical',
                        'AmitShield Alert',f'Threat blocked: {name} [PID:{pid}]'])
                    break
        except Exception: pass

def main():
    log.info('=== AmitShield v1.0 starting ===')
    setup_firewall()
    scan = 0
    while True:
        scan += 1
        scan_processes()
        log.info(f'Scan #{scan} complete')
        time.sleep(30)

if __name__ == '__main__':
    main()
SHIELD
          sudo chmod +x "$BUILD_DIR/config/includes.chroot/usr/local/bin/amitshield"

          sudo tee "$BUILD_DIR/config/includes.chroot/etc/systemd/system/amitshield.service" > /dev/null << 'SVC'
[Unit]
Description=AmitShield Security Engine
After=network.target
[Service]
Type=simple
ExecStart=/usr/local/bin/amitshield
Restart=on-failure
RestartSec=5s
[Install]
WantedBy=multi-user.target
SVC

      - name: Create Desktop Shortcuts
        run: |
          BUILD_DIR="/tmp/amitos-build"
          APPS="$BUILD_DIR/config/includes.chroot/usr/share/applications"
          sudo mkdir -p "$APPS"

          sudo tee "$APPS/amitbrowser.desktop" > /dev/null << 'EOF'
[Desktop Entry]
Name=AmitBrowser
Exec=chromium --no-sandbox %U
Icon=chromium
Type=Application
Categories=Network;WebBrowser;
EOF

          sudo tee "$APPS/amitcalc.desktop" > /dev/null << 'EOF'
[Desktop Entry]
Name=AmitCalc
Exec=qalculate-gtk
Icon=accessories-calculator
Type=Application
Categories=Utility;Calculator;
EOF

          sudo tee "$APPS/amitfiles.desktop" > /dev/null << 'EOF'
[Desktop Entry]
Name=AmitFiles
Exec=dolphin
Icon=system-file-manager
Type=Application
Categories=System;FileManager;
EOF

          sudo tee "$APPS/amitshield-ui.desktop" > /dev/null << 'EOF'
[Desktop Entry]
Name=AmitShield
Exec=bash -c "systemctl status amitshield | zenity --text-info --title=AmitShield"
Icon=security-high
Type=Application
Categories=System;Security;
EOF

      - name: Create Chroot Hooks
        run: |
          BUILD_DIR="/tmp/amitos-build"

          # DNS fix hook
          sudo tee "$BUILD_DIR/config/hooks/normal/0000-dns-fix.hook.chroot" > /dev/null << 'EOF'
#!/bin/bash
echo "nameserver 8.8.8.8" > /etc/resolv.conf
EOF
          sudo chmod +x "$BUILD_DIR/config/hooks/normal/0000-dns-fix.hook.chroot"

          # Plymouth activation hook
          sudo tee "$BUILD_DIR/config/hooks/normal/0050-plymouth.hook.chroot" > /dev/null << 'EOF'
#!/bin/bash
set -e
if command -v plymouth-set-default-theme >/dev/null 2>&1; then
    plymouth-set-default-theme amitos 2>/dev/null || \
    plymouth-set-default-theme -R amitos 2>/dev/null || true
fi
if [ -f /usr/sbin/update-initramfs ]; then
    update-initramfs -u 2>/dev/null || true
fi
EOF
          sudo chmod +x "$BUILD_DIR/config/hooks/normal/0050-plymouth.hook.chroot"

          # Super-fix hook
          sudo tee "$BUILD_DIR/config/hooks/normal/9999-super-fix.hook.chroot" > /dev/null << 'EOF'
#!/bin/bash
export DEBIAN_FRONTEND=noninteractive
dpkg --configure -a || true
apt-get install -f -y || true
[ -e /dev/null ] && rm -f /dev/null
mknod -m 666 /dev/null c 1 3
EOF
          sudo chmod +x "$BUILD_DIR/config/hooks/normal/9999-super-fix.hook.chroot"

      - name: Create Sources List
        run: |
          BUILD_DIR="/tmp/amitos-build"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/etc/apt"
          sudo tee "$BUILD_DIR/config/includes.chroot/etc/apt/sources.list" > /dev/null << 'EOF'
deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
EOF

      - name: Copy Boot Files
        run: |
          BUILD_DIR="/tmp/amitos-build"
          sudo mkdir -p "$BUILD_DIR/config/bootloaders/isolinux"
          sudo mkdir -p "$BUILD_DIR/config/includes.binary/isolinux"
          sudo mkdir -p "$BUILD_DIR/config/binary_local-includes/isolinux"
          sudo mkdir -p "$BUILD_DIR/binary/isolinux"

          for f in /usr/lib/ISOLINUX/isolinux.bin \
                   /usr/lib/syslinux/modules/bios/vesamenu.c32 \
                   /usr/lib/syslinux/modules/bios/ldlinux.c32 \
                   /usr/lib/syslinux/modules/bios/libcom32.c32 \
                   /usr/lib/syslinux/modules/bios/libutil.c32 \
                   /usr/lib/syslinux/modules/bios/menu.c32 \
                   /usr/lib/syslinux/modules/bios/chain.c32; do
            if [ -f "$f" ]; then
              sudo cp "$f" "$BUILD_DIR/config/bootloaders/isolinux/"
              sudo cp "$f" "$BUILD_DIR/config/includes.binary/isolinux/"
              sudo cp "$f" "$BUILD_DIR/config/binary_local-includes/isolinux/"
              echo "  [OK] Copied $(basename $f)"
            else
              echo "  [SKIP] $f not found"
            fi
          done

      - name: Generate Bootlogo and Plymouth Splash
        run: |
          BUILD_DIR="/tmp/amitos-build"
          REPO="${GITHUB_WORKSPACE}"

          sudo mkdir -p "$BUILD_DIR/binary/isolinux"
          sudo mkdir -p "$BUILD_DIR/config/bootloaders/isolinux"
          sudo mkdir -p "$BUILD_DIR/config/includes.binary/isolinux"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/share/plymouth/themes/amitos"
          sudo mkdir -p "$BUILD_DIR/config/includes.chroot/usr/share/pixmaps"

          python3 << 'PYEOF'
import os, shutil, sys
try:
    from PIL import Image
    HAS_PIL = True
except ImportError:
    HAS_PIL = False
    import struct, zlib

REPO  = os.environ['GITHUB_WORKSPACE']
BUILD = '/tmp/amitos-build'

def write_fallback_png(path, w=640, h=480):
    """Write minimal dark-navy PNG without Pillow."""
    import struct, zlib
    row = bytes([0]) + bytes([10, 14, 38] * w)
    raw = row * h
    comp = zlib.compress(raw, 1)
    def ck(n, d):
        c = n + d
        return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
    png = b'\x89PNG\r\n\x1a\n'
    png += ck(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
    png += ck(b'IDAT', comp)
    png += ck(b'IEND', b'')
    os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
    with open(path, 'wb') as f:
        f.write(png)
    print(f'  [OK] fallback PNG -> {path}')

def save_png(img_or_path, dest, w, h):
    os.makedirs(os.path.dirname(dest) or '.', exist_ok=True)
    if HAS_PIL:
        if isinstance(img_or_path, str):
            img = Image.open(img_or_path).convert('RGB').resize((w, h), Image.LANCZOS)
        else:
            img = img_or_path.resize((w, h), Image.LANCZOS)
        img.save(dest, 'PNG', optimize=True)
    else:
        write_fallback_png(dest, w, h)
    kb = os.path.getsize(dest) // 1024
    print(f'  [OK] {dest}  ({kb} KB)')

boot_src   = os.path.join(REPO, 'branding', 'bootlogo.png')
splash_src = os.path.join(REPO, 'branding', 'splash.png')

# -- syslinux bootlogo (640x480) -----------------------------------------
bootlogo_dests = [
    f'{BUILD}/binary/isolinux/bootlogo',
    f'{BUILD}/config/bootloaders/isolinux/bootlogo',
    f'{BUILD}/config/includes.binary/isolinux/bootlogo',
]
for d in bootlogo_dests:
    save_png(boot_src, d, 640, 480)

# -- Plymouth splash (1920x1080) ------------------------------------------
splash_dests = [
    f'{BUILD}/config/includes.chroot/usr/share/plymouth/themes/amitos/splash.png',
    f'{BUILD}/config/includes.chroot/usr/share/pixmaps/amitos-splash.png',
]
for d in splash_dests:
    save_png(splash_src, d, 1920, 1080)

# -- Copy originals into branding dir inside chroot -----------------------
branding_dir = f'{BUILD}/config/includes.chroot/usr/local/amitos/branding'
os.makedirs(branding_dir, exist_ok=True)
shutil.copy(boot_src,   os.path.join(branding_dir, 'bootlogo.png'))
shutil.copy(splash_src, os.path.join(branding_dir, 'splash.png'))

print('[OK] All branding images ready.')
PYEOF

          # Plymouth theme descriptor
          sudo tee "$BUILD_DIR/config/includes.chroot/usr/share/plymouth/themes/amitos/amitos.plymouth" > /dev/null << 'PLYM'
[Plymouth Theme]
Name=AmitOS
Description=AmitOS Boot Splash
ModuleName=script

[script]
ImageDir=/usr/share/plymouth/themes/amitos
ScriptFile=/usr/share/plymouth/themes/amitos/amitos.script
PLYM

          # Plymouth script: clean static image + native progress bar drawn on top
          sudo tee "$BUILD_DIR/config/includes.chroot/usr/share/plymouth/themes/amitos/amitos.script" > /dev/null << 'PLYMSCRIPT'
/* AmitOS Plymouth Theme */
/* Static branded splash + native glowing progress bar */

wallpaper_image = Image("splash.png");
screen_w = Plymouth.GetWidth();
screen_h = Plymouth.GetHeight();
scaled   = wallpaper_image.Scale(screen_w, screen_h);
bg       = Sprite(scaled);
bg.SetZ(-100);

bar_h   = 4;
bar_y   = screen_h - 48;
bar_maxw = Math.Int(screen_w * 0.60);
bar_x   = Math.Int((screen_w - bar_maxw) / 2);

track_img = Image.CreateAt(bar_maxw, bar_h);
track_img.Rectangle(0, 0, bar_maxw, bar_h, 0.10, 0.10, 0.15, 0.55);
track = Sprite(track_img);
track.SetPosition(bar_x, bar_y, 1);

fill_img = Image.CreateAt(1, bar_h);
fill     = Sprite(fill_img);
fill.SetPosition(bar_x, bar_y, 2);

fun progress_callback(dur, pct) {
    fw = Math.Int(bar_maxw * pct);
    if (fw < 2) fw = 2;
    nf = Image.CreateAt(fw, bar_h);
    nf.Rectangle(0, 0, fw, bar_h, 0.0, 0.78, 1.0, 1.0);
    nf.Rectangle(0, 0, fw, 1,     0.4, 0.95, 1.0, 0.7);
    fill.SetImage(nf);
}
Plymouth.SetBootProgressFunction(progress_callback);

fun quit_callback() {
    bg.SetOpacity(0);
    track.SetOpacity(0);
    fill.SetOpacity(0);
}
Plymouth.SetQuitFunction(quit_callback);
PLYMSCRIPT

          echo "[OK] Bootlogo and Plymouth theme created."

      - name: Build ISO
        run: |
          set -o pipefail
          BUILD_DIR="/tmp/amitos-build"
          cd "$BUILD_DIR"

          # Remove leading whitespace artifact from heredoc-indented hooks
          for f in config/hooks/normal/*.hook.chroot; do
            sudo sed -i 's/^[[:space:]]\{10\}//' "$f" 2>/dev/null || true
          done

          # Ensure bootlogo is in place (lb_binary_syslinux line 365 needs it)
          sudo mkdir -p binary/isolinux
          if [ ! -f binary/isolinux/bootlogo ]; then
            echo "[WARN] bootlogo missing, copying from config/bootloaders"
            sudo cp config/bootloaders/isolinux/bootlogo binary/isolinux/bootlogo 2>/dev/null || \
            sudo cp config/includes.binary/isolinux/bootlogo binary/isolinux/bootlogo 2>/dev/null || \
            echo "[WARN] no bootlogo found - build may fail"
          else
            echo "[OK] bootlogo present: $(wc -c < binary/isolinux/bootlogo) bytes"
          fi

          echo "=== Starting lb build ==="
          sudo lb build 2>&1 | tee /tmp/lb-build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "=== BUILD FAILED (exit $BUILD_EXIT) ==="
            echo "=== Last 150 lines ==="
            tail -150 /tmp/lb-build.log || true
            exit $BUILD_EXIT
          fi

          echo ""
          echo "=== BUILD SUCCESS ==="
          ls -lh *.iso 2>/dev/null || echo "WARNING: No ISO found!"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amit-os-1.0-amd64
          path: /tmp/amitos-build/*.iso
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build-${{ github.run_number }}
          name: "Amit OS 1.0 Build #${{ github.run_number }}"
          body: |
            ## Amit OS 1.0 - Automated Build

            **Security**: AmitShield Engine with real-time threat detection
            **Desktop**: KDE Plasma with Breeze Dark theme
            **Apps**: 15+ custom apps included
            **Boot**: Custom AmitOS plymouth splash with native progress bar

            Built from commit: ${{ github.sha }}
          files: /tmp/amitos-build/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
