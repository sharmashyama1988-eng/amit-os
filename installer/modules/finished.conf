# =============================================================================
# Calamares — finished module configuration
# Module: finished  (last page shown after installation)
# Reference: https://github.com/calamares/calamares/tree/calamares/src/modules/finished
# =============================================================================

---

# --------------------------------------------------------------------------
# Restart / Reboot options
# --------------------------------------------------------------------------

# Show the "Restart now" checkbox on the finished page.
restartNowEnabled: true

# Whether the "Restart now" checkbox is ticked by default.
restartNowChecked: true

# Command executed when the user confirms a restart.
# The default uses systemctl; adjust if your live environment differs.
restartNowCommand: "systemctl reboot"

# --------------------------------------------------------------------------
# "Not now" / close behaviour
# --------------------------------------------------------------------------

# If true, clicking "Done" without restarting will run the command below
# (e.g., to eject the live medium before the user reboots manually).
notNowCommand: ""

# --------------------------------------------------------------------------
# Finished-page display options
# --------------------------------------------------------------------------

# When set to true the finished page shows a short summary of what was done.
# Requires the 'summary' module to have run earlier in the sequence.
# showSummary: false

# --------------------------------------------------------------------------
# URLs / links shown on the finished screen (optional)
# --------------------------------------------------------------------------
urls:
    - name: "AmitOS Website"
      url:  "https://amitos.github.io"
    - name: "Release Notes"
      url:  "https://amitos.github.io/release-notes"
    - name: "Community Support"
      url:  "https://amitos.github.io/support"
