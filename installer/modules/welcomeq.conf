# =============================================================================
# Calamares — welcomeq module configuration
# Module: welcomeq  (Qt-based welcome screen)
# Reference: https://github.com/calamares/calamares/tree/calamares/src/modules/welcomeq
# =============================================================================

---

# --------------------------------------------------------------------------
# Branding / descriptive settings
# These values are shown on the Welcome page header.
# --------------------------------------------------------------------------

# Minimum required resolution (pixels). Warn the user if below this.
# Set to 0 to disable the check.
requirements:
    requiredStorage: 10        # GiB — minimum free disk space
    requiredRam: 2.0           # GiB — minimum RAM
    internetCheckUrl: "https://google.com"
    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - storage
        - ram
        - root

# --------------------------------------------------------------------------
# URL links displayed on the Welcome page
# --------------------------------------------------------------------------

# "Release Notes" button — opens the AmitOS release notes page
showReleaseNotesUrl: true
releaseNotesUrl: "https://amitos.github.io/release-notes"

# "Known Issues" button — opens the bug tracker / known issues page
showKnownIssuesUrl: true
knownIssuesUrl: "https://github.com/AmitOS/amitos/issues"

# "Get Support" button — opens the community support page
showSupportUrl: true
supportUrl: "https://amitos.github.io/support"

# "Donate" button — show or hide donation link
showDonateUrl: false
donateUrl: "https://amitos.github.io/donate"

# --------------------------------------------------------------------------
# Geo-IP language detection (optional)
# Automatically suggests the installer language based on the user's location.
# --------------------------------------------------------------------------
geoip:
    style:    "json"
    url:      "https://geoip.kde.org/v1/calamares"
    selector: ""            # leave empty for default (KDE GeoIP format)

# --------------------------------------------------------------------------
# Displayed languages
# Leave empty to show all available translations.
# --------------------------------------------------------------------------
# languages: []
